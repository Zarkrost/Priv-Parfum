<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Busco · Privé Parfum</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --navy: #0A2840;
    --gold: #C4A838;
    --gold-soft: rgba(196, 168, 56, 0.18);
    --cream: #F5F1E8;
    --ink: #1A1A1A;
    --muted: #6B7280;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .top {
    background: var(--navy);
    padding: 28px 20px 22px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
  }
  .top .marca {
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  .top h1 {
    color: var(--white);
    font-size: 21px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  form {
    max-width: 480px;
    margin: 0 auto;
    padding: 22px 18px 110px;
  }
  .campo { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 6px;
  }
  .obligatorio { color: var(--gold); }
  select, input, textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #DDD6C5;
    border-radius: 10px;
    background: var(--white);
    font-size: 15px;
    color: var(--ink);
    font-family: inherit;
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-soft);
  }
  textarea { resize: vertical; min-height: 70px; }
  #campo-tamano { display: none; }
  .ayuda { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .enviar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--cream) 65%, rgba(245, 241, 232, 0));
  }
  button[type="submit"] {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: block;
    background: var(--gold);
    color: var(--navy);
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.6; }
  button[type="submit"]:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
</style>
</head>
<body>

<div class="top">
  <p class="marca">Privé Parfum</p>
  <h1>¿Qué estás buscando?</h1>
</div>

<form id="formulario">
  <div class="campo">
    <label for="tipo">Tipo <span class="obligatorio">*</span></label>
    <select id="tipo" required>
      <option value="" disabled selected>Selecciona una opción</option>
      <option value="precintada">Botella precintada 🔒</option>
      <option value="completa">Botella completa 🍾</option>
      <option value="parcial">Botella parcial 🧴</option>
      <option value="decant">Decant 💧</option>
      <option value="tapon">Tapón 🔘</option>
    </select>
  </div>

  <div class="campo" id="campo-tamano">
    <label for="tamano">Tamaño del decant <span class="obligatorio">*</span></label>
    <select id="tamano">
      <option value="" disabled selected>Selecciona un tamaño</option>
      <option value="3">3 ml</option>
      <option value="5">5 ml</option>
      <option value="10">10 ml</option>
    </select>
  </div>

  <div class="campo">
    <label for="marca">Marca <span class="obligatorio">*</span></label>
    <input id="marca" type="text" maxlength="80" placeholder="Ej. Tom Ford" required>
  </div>

  <div class="campo">
    <label for="modelo">Modelo <span class="obligatorio">*</span></label>
    <input id="modelo" type="text" maxlength="80" placeholder="Ej. Oud Wood" required>
  </div>

  <div class="campo">
    <label for="comentarios">Comentarios</label>
    <textarea id="comentarios" maxlength="300" placeholder="Tamaño exacto, presupuesto, urgencia..."></textarea>
    <p class="ayuda">Opcional</p>
  </div>

  <div class="enviar">
    <button type="submit" id="btnEnviar">Publicar búsqueda</button>
  </div>
</form>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const selectTipo = document.getElementById('tipo');
  const campoTamano = document.getElementById('campo-tamano');
  const selectTamano = document.getElementById('tamano');

  selectTipo.addEventListener('change', () => {
    const esDecant = selectTipo.value === 'decant';
    campoTamano.style.display = esDecant ? 'block' : 'none';
    selectTamano.required = esDecant;
    if (!esDecant) selectTamano.value = '';
  });

  document.getElementById('formulario').addEventListener('submit', (e) => {
    e.preventDefault();

    const tipo = selectTipo.value;
    const tamano = selectTamano.value;
    const marca = document.getElementById('marca').value.trim();
    const modelo = document.getElementById('modelo').value.trim();
    const comentarios = document.getElementById('comentarios').value.trim();

    if (!tipo || !marca || !modelo || (tipo === 'decant' && !tamano)) {
      const msg = 'Completa los campos obligatorios antes de enviar.';
      if (tg) { tg.showAlert(msg); } else { alert(msg); }
      return;
    }

    const datos = { tipo, tamano: tipo === 'decant' ? tamano : null, marca, modelo, comentarios };

    document.getElementById('btnEnviar').disabled = true;

    if (tg) {
      tg.sendData(JSON.stringify(datos));
      tg.close();
    } else {
      alert('Esto solo funciona dentro de Telegram.');
      document.getElementById('btnEnviar').disabled = false;
    }
  });
</script>
</body>
</html>
